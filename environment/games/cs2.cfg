// environment/games/cs2.cfg

//|--------------------|\\
//|  Counter-Strike 2  |\\
//|--------------------|\\

// F.K.A. autoexec.cfg

// Crosshair
cl_crosshairalpha "200"
cl_crosshaircolor "5"
cl_crosshaircolor_b "50"
cl_crosshaircolor_r "50"
cl_crosshaircolor_g "250"
cl_crosshairdot "0"
cl_crosshairgap "0"
cl_crosshairsize "5"
cl_crosshairstyle "4"
cl_crosshairusealpha "1"
cl_crosshairthickness "0.5"
cl_fixedcrosshairgap "0"
cl_crosshair_outlinethickness "0"
cl_crosshair_drawoutline "0"

// Network Settings
rate 786432
cl_interp_ratio 1
cl_interp 0

// Graphics Settings
fps_max 400
r_drawtracers_firstperson 0

// Movement Binds
bind "e" +forward
bind "d" +back
bind "s" +moveleft
bind "f" +moveright
bind "a" +sprint
bind SPACE +jump
bind MWHEELUP +jump
bind MWHEELDOWN +jump
bind SHIFT +duck

// Quickswitch
alias +knife slot3
alias -knife lastinv
bind RCTRL +knife

// Action Binds
bind "z" +lookatweapon
bind "r" +reload
bind "," +voicerecord
bind "." drop
bind "y" say
bind "t" say_team

// Weapon Binds
bind "w" slot1
bind "1" slot1
bind "2" slot2
bind "3" slot4
bind "q" slot5

// Grenade Binds
bind "g" "use weapon_smokegrenade"
bind "v" "use weapon_hegrenade"
bind "c" "use weapon_flashbang"
bind "x" "use weapon_molotov;use weapon_incgrenade;"

// Mouse Sensitivity
m_rawinput “1”
m_customaccel “0”
m_mousespeed “0”

// Quality of Life
cl_autowepswitch 0
cl_use_opens_buy_menu 1
closeonbuy 0
cl_autohelp 0
cl_showhelp 0
cl_crosshair_recoil 0

// Buy Binds
bind "kp_slash" "buy vest;"
bind "kp_multiply" "buy molotov; buy incgrenade;"
bind "kp_plus" "buy vesthelm;"
bind "kp_minus" "buy defuser;"
bind "kp_leftarrow" "buy ak47; buy m4a1;"
bind "kp_5" "buy awp;"
bind "kp_rightarrow" "buy nova;"
bind "kp_end" "buy p250;"
bind "kp_downarrow" "buy tec9; buy fiveseven;"
bind "kp_pgdn" "buy deagle;"
bind "kp_home" "buy smokegrenade;"
bind "kp_uparrow" "buy flashbang;"
bind "kp_pgup" "buy hegrenade;"
bind "kp_enter" "buy smokegrenade; buy flashbang; buy flashbang; buy hegrenade;"
bind "kp_ins" "buy ak47; buy m4a1; buy vesthelm; buy defuser; buy smokegrenade; buy hegrenade; buy flashbang; buy flashbang;"
bind "kp_del" "buy ssg08;"

// Radar Settings
cl_radar_always_centered "0"
cl_radar_scale "0.3"
cl_hud_radar_scale "1.15"
cl_radar_icon_scale_min "1"
cl_radar_rotate "0"
cl_radar_square_with_scoreboard "1"

// Radar Zoom Script
bind “pgup” “incrementvar cl_radar_scale 0.25 1.0 0.05”;
bind “pgdn” “incrementvar cl_radar_scale 0.25 1.0 -0.05”;

// Audio
volume 0.5
snd_mixahead 0.025

// Score screen shows net_graph
net_graph 1
net_graphheight 9999
bind TAB "+scorenet"
alias "+scorenet" "+showscores; net_graphheight 0"
alias "-scorenet" "-showscores; net_graphheight 9999"

// Display damage
developer "1"
con_enable "1"
con_filter_enable "2"
con_filter_text "Damage"
con_filter_text_out Player:

// Finishing Notification
echo " "
echo " "
echo "+--------------------+"
echo "| Autoexec Activated |"
echo "+--------------------+"
echo " "
